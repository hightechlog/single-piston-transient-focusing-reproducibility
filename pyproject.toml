[project]
name = "single-piston-transient-focusing-reproducibility"
version = "0.1.0"
description = "Reproducibility code for single-piston transient acoustic focusing."
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
